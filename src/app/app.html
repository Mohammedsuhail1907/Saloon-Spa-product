<app-header />

<main class="app-main" id="main">
  <router-outlet />
</main>

<app-footer />

@if (showStickyCta()) {
  <div class="sticky-cta">
    <a routerLink="/booking" class="sticky-cta__btn">Book Appointment</a>
  </div>
}

@if (ui.relaxMode()) {
  <div class="breath-widget" role="status" aria-label="Relaxation mode is on">
    <div class="breath-widget__circle" aria-hidden="true"></div>
    <span class="breath-widget__text">Breathe in… breathe out</span>
  </div>
}

<p-toast position="top-right" />
<p-confirmdialog [style]="{ 'max-width': '26rem' }" />
