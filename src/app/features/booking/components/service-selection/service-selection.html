<h2 class="booking-panel__title">Choose your service</h2>

@if (filteredBy(); as pro) {
  <p class="hint-text">
    Showing services by {{ pro }} —
    <button type="button" class="link-btn" (click)="showAll.emit()">show everything</button>
  </p>
}

@for (group of groups(); track group.label) {
  @if (groups().length > 1) {
    <h3 class="booking-panel__group">{{ group.label }}</h3>
  }
  <div class="pick-list" role="listbox" aria-label="Services">
    @for (s of group.items; track s.id) {
      <button
        type="button"
        class="pick-row"
        role="option"
        [class.is-selected]="selectedId() === s.id"
        [attr.aria-selected]="selectedId() === s.id"
        (click)="serviceSelect.emit(s)"
      >
        <span class="pick-row__art {{ s.art }}"><i class="{{ s.icon }}" aria-hidden="true"></i></span>
        <span class="pick-row__body">
          <strong>{{ s.name }}</strong>
          <span>{{ s.duration }} min · {{ s.price | price }}</span>
        </span>
        <i class="pi pi-check-circle pick-row__check" aria-hidden="true"></i>
      </button>
    }
  </div>
}
