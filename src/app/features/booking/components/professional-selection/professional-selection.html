<h2 class="booking-panel__title">
  {{ serviceType() === 'SPA' ? 'Choose your therapist' : 'Meet your stylist' }}
</h2>

<div class="pick-list">
  <button
    type="button"
    class="pick-row"
    [class.is-selected]="anySelected()"
    (click)="professionalSelect.emit(null)"
  >
    <span class="pick-row__art art-pearl"><i class="pi pi-users" aria-hidden="true"></i></span>
    <span class="pick-row__body">
      <strong>Any available professional</strong>
      <span>We’ll match you with whoever is free</span>
    </span>
    <i class="pi pi-check-circle pick-row__check" aria-hidden="true"></i>
  </button>

  @for (pro of options(); track pro.id) {
    <button
      type="button"
      class="pick-row"
      [class.is-selected]="selectedId() === pro.id"
      (click)="professionalSelect.emit(pro)"
    >
      <p-avatar [label]="initials(pro.name)" shape="circle" styleClass="mini-avatar {{ pro.palette }}" />
      <span class="pick-row__body">
        <strong>{{ pro.name }}</strong>
        <span>{{ pro.role }} · {{ pro.experienceYears }} yrs · <i class="pi pi-star-fill"></i> {{ pro.rating }}</span>
      </span>
      <i class="pi pi-check-circle pick-row__check" aria-hidden="true"></i>
    </button>
  }
</div>
